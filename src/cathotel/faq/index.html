<title>Idle Cat Hotel FAQ</title>

<link rel="alternate" hreflang="ko" href="ko.html">
<link rel="alternate" hreflang="en" href="en.html">
<link rel="alternate" hreflang="ja" href="ja.html">
<link rel="alternate" hreflang="zh-Hant" href="zh-tw.html">
<script>
  (function () {
    // ?lang=ko|en|ja|zh-tw 가 있으면 그 언어, 없으면 브라우저 언어로 이동. #id 는 그대로 넘긴다.
    var m = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
    var l = (m ? m[1] : (navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
    var file = 'en.html';
    if (l.indexOf('ko') === 0) file = 'ko.html';
    else if (l.indexOf('ja') === 0) file = 'ja.html';
    else if (l.indexOf('zh') === 0 && /tw|hk|mo|hant/.test(l)) file = 'zh-tw.html';
    location.replace(file + location.hash);
  })();
</script>

  body { font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px; background: #fbf6ef; color: #3b2f27; }

</style>
</head>
